# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "komika"
arch: ${GOARCH}
platform: "linux"
version: "0.0.1"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Cross-platform manga viewer"
vendor: "Komika"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/komika"
    dst: "/usr/local/bin/komika"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/komika.png"
  - src: "./build/linux/komika.desktop"
    dst: "/usr/share/applications/komika.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
# WebKitGTK <video> uses GStreamer. H.264/AAC MP4 typically needs libav (+ good for qtdemux/MP4).
# VLC can play the same files via its own codecs even when WebView cannot.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - gstreamer1.0-libav
  - gstreamer1.0-plugins-good

# Extra demuxers/codecs and host transcoder fallback.
recommends:
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-plugins-ugly
  - gstreamer1.0-tools
  - ffmpeg

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  # Fedora default repos ship ffmpeg-free; full ffmpeg is RPM Fusion.
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - gstreamer1-plugin-libav
      - gstreamer1-plugins-good
    recommends:
      - gstreamer1-plugins-base
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugins-ugly-free
      - ffmpeg-free

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
      - gst-libav
      - gst-plugins-good
    recommends:
      - gst-plugins-base
      - gst-plugins-bad
      - gst-plugins-ugly
      - ffmpeg

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
